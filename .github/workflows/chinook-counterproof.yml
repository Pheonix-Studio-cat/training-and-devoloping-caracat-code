# Chinook Security — Gegenproben-Bot.
#
# Er bricht den Code dieses Repos absichtlich und laesst die eigenen Tests
# laufen. Was gruen bleibt, ist ein Verhalten, das nichts prueft.
#
# Eigene Datei, damit `ci.yml` unberuehrt bleibt: faellt dieser Schritt, faellt
# nicht der Rest.
name: Chinook Security — Gegenprobe

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Montags. Mutationstesten kostet einen vollen Testlauf je Mutation --
    # das gehoert nicht in jeden Push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gegenprobe:
    runs-on: ubuntu-latest
    steps:
      # Dieselben Commits, auf die `ci.yml` in diesem Repo schon festgelegt
      # ist -- keine zweite Fassung derselben Action einfuehren.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Hier arbeitet der Bot ueber den Syntaxbaum (Python), nicht zeilenweise
      # -- also chirurgisch: gedreht wird genau ein Operator, der Rest der
      # Datei bleibt Zeichen fuer Zeichen gleich.
      #
      # `scripts/` und `configs/` sind ausgenommen: dort liegen Einstiegs- und
      # Beispieldateien, die `pytest` ohnehin nicht prueft. Eine Mutation dort
      # ueberlebt immer und saegt nur am Budget.
      #
      # Ohne gruene Vorlage endet der Schritt mit 2 ("beweist nichts") statt
      # mit 0: waere die Suite schon vorher rot, liesse sich eine gefangene
      # Mutation nicht von einem kaputten Stand unterscheiden.
      - name: Gegenprobe
        uses: Pheonix-Studio-cat/Chinook-security/actions/counterproof@8d74ad3b09863684cd638ab774872a27dee1965b # Gegenproben-Bot
        with:
          test-command: "pytest -q"
          exclude: "scripts,configs,space,interface"
          budget: "25"
          test-timeout: "600"
          fail-on: "high"
          sarif: ""
